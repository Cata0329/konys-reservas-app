<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto · Konys Pizza</title>
  <meta name="description" content="Dirección y horario de atención de Konys Pizza en Bucaramanga.">
  <meta name="theme-color" content="#173F35">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23173F35'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-style='italic' font-weight='700' font-size='20' fill='%23E9D56B' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/pagina-contacto.js"></script>
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div id="aviso-config"></div>
  <header id="cabecera" class="cabecera"></header>

  <main id="contenido">
    <section class="seccion" aria-labelledby="titulo-contacto">
      <div class="contenedor">
        <div class="seccion__cabecera">
          <p class="antetitulo">Contacto</p>
          <h1 class="titulo-seccion" id="titulo-contacto">Te esperamos en la carrera 36</h1>
          <p class="entradilla">Reserva tu mesa en línea o acércate al restaurante. Aquí tienes la dirección y el horario de atención.</p>
        </div>
        <div class="contacto">
          <section class="panel contacto__bloque" aria-labelledby="titulo-direccion">
            <h2 id="titulo-direccion">Dirección</h2>
            <p class="contacto__dato"><span data-icono="ubicacion"></span>Carrera 36 con calle 41, Bucaramanga, Santander, Colombia</p>
            <div class="panel__acciones">
              <a class="btn btn--primario" href="reservar.html">Reservar una mesa <span data-icono="flechaDerecha"></span></a>
              <a class="btn btn--secundario" href="mi-reserva.html">Consultar mi reserva</a>
            </div>
          </section>
          <section class="panel contacto__bloque" aria-labelledby="titulo-horario">
            <h2 id="titulo-horario">Horario de atención</h2>
            <div id="horario-semana"><div class="esqueleto" aria-busy="true"><span></span><span></span><span></span></div></div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <footer id="pie" class="pie"></footer>
</body>
</html>
