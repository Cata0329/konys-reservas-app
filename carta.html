<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carta · Konys Pizza</title>
  <meta name="description" content="Carta de Konys Pizza: Konys, desgranados, papas, lasaña, granizados, sodas, cócteles y postres con precios en pesos colombianos.">
  <meta name="theme-color" content="#173F35">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23173F35'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-style='italic' font-weight='700' font-size='20' fill='%23E9D56B' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/pagina-carta.js"></script>
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div id="aviso-config"></div>
  <header id="cabecera" class="cabecera"></header>

  <main id="contenido">
    <!-- Carta -->
    <section class="seccion carta" id="carta" aria-labelledby="titulo-carta">
      <div class="contenedor">
        <div class="seccion__cabecera">
          <p class="antetitulo">La carta</p>
          <h1 class="titulo-seccion" id="titulo-carta">Para pedir con calma cuando llegues</h1>
          <p class="entradilla">Carta informativa con platos y precios en pesos colombianos. Los pedidos se toman en la mesa.</p>
        </div>
        <div class="buscador-carta">
          <label for="buscar-carta" class="visualmente-oculto">Buscar en la carta</label>
          <input class="entrada" id="buscar-carta" type="search" placeholder="Buscar un plato o bebida…" autocomplete="off">
          <p class="buscador-carta__estado" id="resultado-busqueda" aria-live="polite"></p>
        </div>
        <div class="pestanas" role="tablist" aria-label="Categorías de la carta" id="pestanas"></div>
        <div id="carta-lista" role="tabpanel" aria-live="polite">
          <div class="esqueleto" aria-busy="true"><span></span><span></span><span></span></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="pie" class="pie"></footer>
</body>
</html>
